<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B2E10" />
    <title>You're offline — Prabodh</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f5;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #5b2e10;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #ecdfd2;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 18px 40px rgba(91, 46, 16, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a6a48;
        background: #f5ede4;
        border: 1px solid #ecdfd2;
        border-radius: 999px;
        padding: 6px 12px;
        margin-bottom: 18px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #d96b27;
      }
      h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.6; color: #8a6a50; margin-top: 10px; }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #d96b27;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        padding: 13px 16px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover { background: #c05a1c; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge"><span class="dot"></span>Prabodh</span>
      <h1>You're offline</h1>
      <p>
        This page isn't available right now. Check your connection and try again — your saved views will load as soon
        as you're back online.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
