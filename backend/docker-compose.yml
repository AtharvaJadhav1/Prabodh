services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
      POSTGRES_DB: sih_portal
    ports:
      - "5432:5432"
    volumes:
      - sih_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sih_pg:
