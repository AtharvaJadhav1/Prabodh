# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-prabodh-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          # Next.js bakes the /api rewrite target in at build time — point it at the Azure backend.
          API_URL: https://app-prabodh-app-ghhkd2h9e0apakez.centralindia-01.azurewebsites.net
          NEXT_PUBLIC_API_URL: https://app-prabodh-app-ghhkd2h9e0apakez.centralindia-01.azurewebsites.net/api
          NEXT_PUBLIC_APP_URL: https://incubation.prabodh.app
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Assemble standalone deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Zip artifact for deployment
        run: |
          cd .next/standalone
          zip -r ../../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC3D46BBBB3C4BE5A2ED7E81CB87C8DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E104B7B3EDA4B39BA27FC8593027D0C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C8FAA1658E14F0EAA6ED3054607C38A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-prabodh-web'
          slot-name: 'Production'
          package: release.zip
