# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-prabodh-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate Prisma client
        env:
          # Placeholder only: `prisma generate` compiles the client and never connects.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F0A5B1A87AD496C9EC1FD23C1AC8348 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C276890C62CC4B5D9476FC630F8F5DD1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DDE19CA510FB4F5C836D8C98FE700692 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-prabodh-app'
          slot-name: 'Production'
          package: .
          # The package ships node_modules + dist and is mounted read-only, so `npm install` must not run.
          startup-command: node dist/main.js
          