name: Deploy

on:
  push:
    branches: [main]
  # Manual trigger, so a branch can be validated before it is merged. Defaults
  # to a dry run: a manual click must never cut over production by accident.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + backup, no cutover)'
        type: boolean
        required: false
        default: true
      sha:
        description: 'Commit SHA to deploy (blank = the ref that triggered this run)'
        type: string
        required: false
        default: ''

# One deploy at a time. Never cancel a deploy that is mid-cutover.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the VM. `next` and `sharp` require >=20.9.0; nothing needs 21+.
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # --include=dev so this stays correct even if NODE_ENV=production is
        # set at the org or repository level, which would make npm omit devDependencies.
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate Prisma client
        env:
          # Placeholder only: `prisma generate` compiles the client and never connects.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --include=dev so this stays correct even if NODE_ENV=production is
        # set at the org or repository level, which would make npm omit devDependencies.
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Hermetic: auth is localStorage-based and all API calls are client-side,
        # so no backend or NEXT_PUBLIC_* values are needed to compile.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  deploy:
    name: Deploy to VM
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/vm_key"
          chmod 600 "$HOME/.ssh/vm_key"

      - name: Write pinned known_hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Pins the VM host key (generated with: ssh-keyscan -p <port> <host>).
          # StrictHostKeyChecking stays on; we never fall back to TOFU.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # `inputs.sha` is empty for a push, so this resolves to github.sha
          # (the pushed commit) for normal deploys and to the typed SHA for a
          # manual run. github.sha alone is wrong for workflow_dispatch: it is
          # the ref the workflow was invoked from, not a ref named in an input.
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY_RUN="$(printf '%s' "$DRY_RUN_INPUT" | tr '[:upper:]' '[:lower:]')"
          DEPLOY_PORT_TRIMMED="$(printf '%s' "$DEPLOY_PORT" | tr -d '\r\n')"
          TARGET_SHA_TRIMMED="$(printf '%s' "$TARGET_SHA" | tr -d '\r\n' | grep -E '^[0-9a-f]{7,40}$' || printf '%s' "$TARGET_SHA" | tr -d '\r\n')"
          dry_flag=''
          if [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "1" ]; then
            dry_flag='--dry-run'
          fi
          # The script is piped over stdin rather than executed from the VM repo:
          # it checks that repo out to a detached SHA, which would otherwise
          # rewrite the running script underneath bash mid-execution.
          ssh -i "$HOME/.ssh/vm_key" \
            -p "$DEPLOY_PORT_TRIMMED" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o LogLevel=ERROR \
            "$VM_USERNAME@$VM_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s -- $dry_flag '$TARGET_SHA_TRIMMED'" \
            < scripts/deploy-server.sh

      - name: Smoke test
        # A dry run never cut over, so the live site is still the previous
        # release. Probing it here would report success for a build that was
        # never actually released.
        if: ${{ inputs.dry_run != true }}
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          # Runs from the runner, outside the VM, so this also proves nginx,
          # TLS and DNS are serving the freshly deployed release.
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 15 -o /dev/null "$SMOKE_URL"; then
              echo "Smoke test passed: $SMOKE_URL (attempt $attempt)"
              echo "### Deploy succeeded" >> "$GITHUB_STEP_SUMMARY"
              echo "- Commit: \`$TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Smoke test: \`$SMOKE_URL\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 6
          done
          echo "Smoke test failed: $SMOKE_URL"
          echo "### Deploy finished, smoke test FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: \`$SMOKE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          {
            echo "### Dry run complete — nothing was released"
            echo "- Commit: \`${{ inputs.sha || github.sha }}\`"
            echo "- Build and database backup succeeded; \`current\` still points at the previous release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH private key
        if: always()
        run: rm -f "$HOME/.ssh/vm_key"
